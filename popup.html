<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Manga Extractor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="card">
      <h1>漫画图片提取器</h1>
      <p class="subtitle">中性灰 · 圆角界面 · 一键打包 ZIP</p>

      <section class="panel">
        <h2>图片尺寸筛选（可拖动）</h2>
        <label>
          最小宽度：<span id="minWidthValue">600</span>px
          <input id="minWidth" type="range" min="100" max="2400" step="10" value="600" />
        </label>
        <label>
          最小高度：<span id="minHeightValue">800</span>px
          <input id="minHeight" type="range" min="100" max="3600" step="10" value="800" />
        </label>
      </section>

      <section class="panel">
        <h2>图片比例筛选（可视化）</h2>
        <label>
          最小宽高比：<span id="minRatioValue">0.55</span>
          <input id="minRatio" type="range" min="0.20" max="1.60" step="0.01" value="0.55" />
        </label>
        <label>
          最大宽高比：<span id="maxRatioValue">0.90</span>
          <input id="maxRatio" type="range" min="0.20" max="1.60" step="0.01" value="0.90" />
        </label>

        <div class="ratio-visual">
          <div class="frame">
            <div id="ratioMinBox" class="ratio-box min"></div>
            <div id="ratioMaxBox" class="ratio-box max"></div>
          </div>
          <p id="ratioHint">当前允许范围：0.55 ~ 0.90（越小越竖版）</p>
        </div>
      </section>

      <section class="panel grid2">
        <label>文件前缀 <input id="prefix" type="text" value="manga" /></label>
        <label>章节名 <input id="chapter" type="text" value="chapter" /></label>
      </section>

      <div class="actions">
        <button id="collectBtn" class="btn primary">1. 提取当前页</button>
        <button id="downloadBtn" class="btn" disabled>2. 下载 ZIP</button>
      </div>

      <p id="status" class="status">等待操作</p>
      <ol id="preview"></ol>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
