[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "mise-ingestion-worker"
version = "0.1.0"
description = "Ephemeral, traceable recipe media ingestion worker"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.16.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_worker"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = [
  "S101", # Assertions are appropriate in tests.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
